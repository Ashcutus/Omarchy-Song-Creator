name: Tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -v
      - run: python -m py_compile app.py core.py appearance.py i18n.py
      - run: bash -n install.sh launch.sh setup-ollama.sh
