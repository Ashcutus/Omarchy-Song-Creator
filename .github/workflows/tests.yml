name: Tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 desktop-file-utils xvfb dbus-x11
      - run: /usr/bin/python3 -m unittest discover -v
      - run: python -m py_compile app.py core.py appearance.py i18n.py
      - run: bash -n install.sh launch.sh setup-ollama.sh
      - run: dbus-run-session -- xvfb-run -a env VERSEWORK_DATA=/tmp/versework-ci GSK_RENDERER=cairo ./launch.sh --smoke
      - run: dbus-run-session -- xvfb-run -a env VERSEWORK_TEST_GTK=1 VERSEWORK_GUI_TEST=1 GSK_RENDERER=cairo /usr/bin/python3 -m unittest test_production_ui test_workflow_gui
